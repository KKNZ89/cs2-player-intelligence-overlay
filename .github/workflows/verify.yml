name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CS2PlayerIntel-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CS2PlayerIntel-rs/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CS2PlayerIntel-rs/src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run smoke
      # CI has no updater signing key, so the installer is built without update signatures.
      - run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: CS2PlayerIntel-rs/src-tauri/target/release/bundle/nsis/*.exe

  # Known vulnerabilities in Rust and npm dependencies. Warnings (unmaintained or unsound crates that only
  # Tauri's Linux builds use) are reported but don't fail the run.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: CS2PlayerIntel-rs/src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm audit --omit=dev
        working-directory: CS2PlayerIntel-rs
