name: Feature request
description: An idea for the app.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Requests for game-memory access, injection, gameplay automation or getting around a site's sign-in or security checks won't be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what's missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: source
    attributes:
      label: Data source
      description: If it needs data, which public source provides it?
