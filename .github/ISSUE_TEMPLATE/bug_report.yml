name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove API keys, GSI tokens, personal paths and any SteamIDs you don't want public before posting.
        Security problems: use Security → Report a vulnerability instead of an issue.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: CS2 display mode
      options:
        - Fullscreen windowed (borderless)
        - Windowed
        - Fullscreen (exclusive)
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce, one per line.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant lines from Diagnostics → Recent log (redacted).
      render: text
